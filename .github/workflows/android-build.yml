name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The Android Gradle Plugin used by OpenBoard (7.0) needs JDK 11.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # sdkmanager itself needs Java 17, which the runner image provides.
      - name: Install the NDK version used by the native code
        run: |
          JAVA_HOME="$JAVA_HOME_17_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;21.3.6528147" | grep -v "^\[" || true
          test -d "$ANDROID_HOME/ndk/21.3.6528147"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zpand-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
