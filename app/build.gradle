apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 31

    defaultConfig {
        // Zpand: own application id so it can be installed next to OpenBoard.
        applicationId "io.github.pythdom.zpand"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // A fixed, public signing key for personal builds, so that each new APK built by CI
        // installs as an update over the previous one. It is NOT a secret: do not use it for
        // a Play Store release.
        zpand {
            storeFile file('zpand-debug.keystore')
            storePassword 'android'
            keyAlias 'zpand'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zpand
        }
        release {
            signingConfig signingConfigs.zpand
            minifyEnabled false
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    lintOptions {
        abortOnError false
    }

    ndkVersion '21.3.6528147'
    androidResources {
        noCompress 'dict'
    }
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1' // Replaces recyclerview:1.0.0 included by above dependency
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}
repositories {
    mavenCentral()
}
